[package]
name = "open-why"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.88"
description = "Local-first decision memory for AI agents: Rust library, CLI, and MCP server with source evidence and history."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/cogitod/open-why"
documentation = "https://github.com/cogitod/open-why/blob/main/docs/integrations.md"
keywords = ["mcp", "ai-agents", "decision-memory", "git", "retrieval"]
categories = ["command-line-utilities", "database", "development-tools"]

[features]
default = ["local-embeddings"]
local-embeddings = ["dep:ort", "dep:tokenizers"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
tokenizers = { version = "0.23", optional = true }
ureq = "3.4.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
strip = false

[dev-dependencies]
toml = "0.8"
