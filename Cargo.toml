[package]
name = "open-why"
version = "0.1.0"
edition = "2021"
description = "Ask any repository why a decision was made — with the evidence."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4.0"
