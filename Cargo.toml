[package]
name = "open-why"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Record and retrieve why code decisions were made, with source evidence and history."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/cogitod/open-why"
keywords = ["ai", "agent", "memory", "decision", "evidence", "retrieval", "why"]
categories = ["command-line-utilities", "database", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.22"
ureq = "3.4.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
strip = false
