name: Validate release candidate

# Explicit maintainer action only. This workflow does not create tags or releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-source:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: checked-source
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned
        with:
          toolchain: 1.88.0
      - name: Require version tag from reviewed main history
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          case "$RELEASE_REF" in refs/tags/v*) ;; *) echo 'Select an authorized version tag'; exit 1 ;; esac
          git merge-base --is-ancestor HEAD origin/main
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_NAME" = "v$version"
      - name: Build and test packaged source and installed artifacts
        run: python3 scripts/prepare-release.py "$RUNNER_TEMP/candidate"
      - name: Attest final artifact bytes
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # pinned 2026-10-09
        with:
          subject-path: '${{ runner.temp }}/candidate/assets/*'
      - name: Retain validated candidate assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned 2026-10-09
        with:
          name: candidate-${{ matrix.os }}
          path: '${{ runner.temp }}/candidate/assets/*'
          if-no-files-found: error
          retention-days: 14
