name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files for secrets, record exports, and private provenance
        run: bash hooks/check-leaks.sh tracked

      - name: Test staged index leak-scan authority
        run: bash tests/check-leaks.sh

      - name: Enforce immutable CI dependencies
        run: bash scripts/check-ci-pins.sh tracked

      - name: Test immutable CI dependency enforcement
        run: bash tests/check-ci-pins.sh

      - name: Enforce tracked Rust file size
        run: bash scripts/check-rust-loc.sh tracked

      - name: Test Rust file-size enforcement
        run: bash tests/check-rust-loc.sh

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, pinned 2026-09-07
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify committed dependency resolution
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Verify dependency advisories, yanks, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          rust-version: "1.88.0"
          command: check advisories licenses sources
          arguments: --all-features

      - name: Verify dependency audit preserved the committed lockfile
        run: git diff --exit-code HEAD -- Cargo.lock

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Format
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, pinned 2026-09-07
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Format (Rust 1.88)
        run: cargo fmt --check

      - name: Build (Rust 1.88 release)
        run: cargo build --release --locked

      - name: Clippy (Rust 1.88)
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test (Rust 1.88)
        run: cargo test --locked
