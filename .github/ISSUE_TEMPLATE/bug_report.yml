name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "Include `why --version` and the installed commit SHA if known."
      placeholder: v0.1.0 or a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Installation and client
      description: How you installed open-why, plus your MCP client and version (or CLI / Rust library).
      placeholder: Cargo Git install; Claude Code, Codex, another MCP client, or CLI
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, what you expected, and how to reproduce it
      placeholder: |
        Summary:
        Steps to reproduce:
        Expected vs. actual:
        Minimal example (use synthetic data):
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics (optional)
      description: Include relevant errors or `why doctor` output. Remove personal paths, repository contents, tokens, and private records before posting. Report vulnerabilities privately using the security link.
