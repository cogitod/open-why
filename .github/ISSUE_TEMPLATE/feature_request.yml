name: Feature request
description: Suggest something open-why should do
labels: [enhancement]
body:
  - type: textarea
    id: details
    attributes:
      label: What and why
      description: Describe a concrete task, what blocks you today, and how this would help capture or retrieve decision rationale. See the Product boundary in PLAN.md for scope.
      placeholder: |
        What:
        Why:
        Rough shape of a solution, if you have one:
    validations:
      required: true
